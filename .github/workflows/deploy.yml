name: Build and Publish

# Builds the app (composer + npm) and force-pushes the complete, ready-to-run
# result as a single commit to `production`. The server-side webhook receiver
# (app/Http/Controllers/DeployWebhookController.php) reacts to that push, not
# to this one - pushes to `main` never touch the live server directly, since
# main is raw source that still needs this build step.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Commit the build artifact to the production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # vendor/ and public/build/ are normally gitignored (they're build
          # output, not source) - force-add just those two on top of
          # everything already tracked on main. node_modules is deliberately
          # left out: it's only needed to run the build, not to serve it.
          git add -A
          git add -f vendor public/build

          git commit -m "Build $(git rev-parse --short HEAD)"

          git push --force origin HEAD:production
